name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
      - name: Lint maintained code
        run: uvx --from ruff==0.15.21 ruff check demo.py interlock examples tests/support tests/test_artifact_publication.py tests/test_mcp_proxy.py tests/test_site.py tests/test_cli.py
      - name: Check formatting
        run: uvx --from ruff==0.15.21 ruff format --check demo.py interlock examples tests/support tests/test_artifact_publication.py tests/test_mcp_proxy.py tests/test_site.py tests/test_cli.py
      - name: Type-check artifact example
        run: uvx --python 3.12 --from mypy==1.19.1 mypy
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12", "3.13"]     # 3.9 is the floor pyproject.toml promises
        include:
          - os: windows-latest
            python-version: "3.13"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Invariants, fault sweep, integration
        run: python -m unittest discover -s tests -v
      - name: Results tables match the code
        if: runner.os == 'Linux'
        run: |
          python experiments/run_all.py > /dev/null
          python viewer/build.py
          git diff --exit-code -I "^Generated" -- results/
